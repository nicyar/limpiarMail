name: Limpieza Automatica de Mails

on:
  schedule:
    # Lunes, Miércoles y Viernes
    - cron: '0 16 * * 1,3,5'   # 13:00 ART (16:00 UTC)
    - cron: '30 17 * * 1,3,5'  # 14:30 ART (17:30 UTC)
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web

jobs:
  limpieza:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install python-dotenv
          # Si tienes mas dependencias en requirements.txt, descomenta la siguiente linea:
          # pip install -r requirements.txt

      - name: Ejecutar script de filtrado
        env:
          EMAIL_SERVIDOR: ${{ secrets.EMAIL_SERVIDOR }}
          EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_PUERTO: 993
        run: python nombre_de_tu_archivo.py